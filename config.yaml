# Publication: services, and the settings of the headless browser that prints PDFs.
# Every parameter can be overridden in yeswiki.config.php; README.md describes each one.
parameters:
  htmltopdf_path: '/usr/bin/chromium'
  htmltopdf_service_url: ''
  page_load_timeout: 60000
  htmltopdf_options:
    windowSize: [1920, 1080]
    noSandbox: true
    headless: true
    userAgent: 'YesWiki/5'
    startupTimeout: 30
    sendSyncDefaultTimeout: 10000
    customFlags:
    - '--crash-dumps-dir=/tmp'
    - '--remote-allow-origins=*'
  htmltopdf_service_authorized_domains: []
  htmltopdf_base_url: ~
  publication_editable_config_params:
    - 'htmltopdf_path'
    - 'htmltopdf_options':
      - windowSize
      - userAgent
    - 'htmltopdf_service_authorized_domains'
    - 'htmltopdf_service_url'

services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: true

  YesWiki\Publication\Action\:
    resource: 'actions/*'

  YesWiki\Publication\Handler\:
    resource: 'handlers/*'

  YesWiki\Publication\Service\:
    resource: 'services/*'

  YesWiki\Publication\Controller\:
    resource: 'controllers/*'
